[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beatflow-skill"
version = "2.0"
description = "A Codex-native, style-neutral music composition skill with deterministic MIDI rendering."
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "the0cp and BeatFlow contributors" }]
dependencies = [
  "pydantic==2.13.4",
  "mido==1.3.3",
  "music21==9.9.2",
]

[project.scripts]
beatflow = "beatflow_core.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/beatflow-skill/scripts" }

[tool.setuptools.packages.find]
where = ["skills/beatflow-skill/scripts"]
include = ["beatflow_core*"]
